spring.application.name=BackEnd

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/Ceylon_Airlines?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=vihan@46
spring.datasource.hikari.maximum-pool-size=10

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===============================
# JACKSON DATE CONFIGURATION
# ===============================
spring.jackson.write-dates-as-timestamps=false

# ===============================
# FILE UPLOAD SETTINGS
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# STATIC FILE ACCESS (UPLOADS)
# ===============================
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# ===============================
# SERVER SETTINGS (Optional)
# ===============================
server.port=8080

