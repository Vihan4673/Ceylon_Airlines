<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceylon Air - Select Your Flight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --airline-primary: #005eb8;
            --airline-secondary: #8b1d41; /* Maroon accent */
            --airline-dark: #003366;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f3f7fa;
        }

        .qatar-blue {
            background-color: var(--airline-primary);
        }

        .hero-banner {
            background-image: linear-gradient(rgba(0, 51, 102, 0.4), rgba(0, 51, 102, 0.4)), url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 180px;
        }

        /* Date Selection Styling */
        .date-card {
            min-width: 110px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 3px solid transparent;
        }

        .date-card.active {
            background-color: #f0f9ff;
            color: var(--airline-primary);
            border-bottom-color: var(--airline-primary);
        }

        .date-card:hover:not(.disabled) {
            background-color: #f8fafc;
        }

        /* Flight Card Styling */
        .flight-card {
            border: 1px solid #e5eef5;
            border-radius: 12px;
            background: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .flight-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .fare-box {
            transition: all 0.2s ease;
            border-left: 1px solid #f1f5f9;
            min-width: 160px;
        }

        .fare-box.selected {
            background-color: #f0f7ff;
            box-shadow: inset 0 0 0 2px var(--airline-primary);
        }

        /* Progress Line */
        .route-line {
            height: 2px;
            background: #e2e8f0;
            width: 100px;
            position: relative;
        }

        .route-line::after {
            content: '\f072';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 0 8px;
            color: #cbd5e1;
            font-size: 12px;
        }

        /* Custom Scrollbar */
        #date-selector::-webkit-scrollbar {
            height: 4px;
        }
        #date-selector::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-800 pb-32">

<!-- Navbar -->
<nav class="qatar-blue text-white px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-lg">
    <div class="flex items-center gap-10">
        <div class="flex items-center gap-4 border-r border-white/20 pr-10">
            <div class="text-right">
                <p id="navFromCode" class="text-xl font-extrabold tracking-tight leading-none">---</p>
                <p id="navFromCity" class="text-[10px] uppercase opacity-70 tracking-widest font-bold">---</p>
            </div>
            <i class="fas fa-exchange-alt opacity-40 text-sm"></i>
            <div class="text-left">
                <p id="navToCode" class="text-xl font-extrabold tracking-tight leading-none">---</p>
                <p id="navToCity" class="text-[10px] uppercase opacity-70 tracking-widest font-bold">---</p>
            </div>
        </div>

        <div class="hidden md:flex gap-10 text-[11px] font-bold uppercase tracking-wider">
            <div class="flex flex-col">
                <span class="opacity-60 text-[9px]">Departure</span>
                <span id="navDepart">---</span>
            </div>
            <div class="flex flex-col">
                <span class="opacity-60 text-[9px]">Return</span>
                <span id="navReturn">---</span>
            </div>
            <div class="flex flex-col">
                <span class="opacity-60 text-[9px]">Passengers</span>
                <span id="navPassengers">0</span>
            </div>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <button class="bg-white/10 hover:bg-white/20 p-2 rounded-full transition">
            <i class="fas fa-shopping-basket"></i>
        </button>
        <div class="h-8 w-[1px] bg-white/20"></div>
        <button class="font-bold text-xs uppercase tracking-widest border border-white/40 px-4 py-2 rounded hover:bg-white hover:text-[#005eb8] transition">
            Modify
        </button>
    </div>
</nav>

<!-- Banner -->
<div class="hero-banner flex items-end">
    <div class="max-w-6xl mx-auto w-full px-4 mb-12">
        <h1 id="heroRoute" class="text-white text-3xl font-extrabold drop-shadow-md"></h1>
    </div>
</div>

<!-- Main Content -->
<main class="max-w-6xl mx-auto px-4 -mt-10 relative z-20">

    <!-- Date Selector Card -->
    <div class="bg-white rounded-xl shadow-2xl border border-slate-100 mb-8 overflow-hidden">
        <div class="bg-slate-50/50 border-b border-slate-100 py-3 px-6 flex justify-between items-center">
            <h2 id="current-date-display" class="font-bold text-[#003366] text-sm"></h2>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">All prices in LKR</span>
        </div>
        <div class="flex overflow-x-auto" id="date-selector">
            <!-- Date items injected here -->
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
        <div class="flex items-center gap-4">
            <button class="flex items-center gap-2 text-xs font-bold text-slate-600 hover:text-blue-600 transition">
                <i class="fas fa-filter"></i> Filters
            </button>
            <div class="h-4 w-[1px] bg-slate-200"></div>
            <p id="passengerSummary" class="text-xs text-slate-500 font-medium"></p>
        </div>
        <div class="flex items-center gap-3 text-xs">
            <span class="text-slate-400 font-medium">Sort by:</span>
            <select class="font-bold text-[#003366] bg-transparent outline-none cursor-pointer">
                <option>Cheapest</option>
                <option>Fastest</option>
                <option>Earliest</option>
            </select>
        </div>
    </div>

    <!-- Flight List -->
    <div id="flights-container" class="space-y-4">
        <!-- Dynamic Flight Cards will be injected here -->
    </div>

</main>

<!-- Selection Footer (Hidden by default) -->
<div id="footer-summary" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-10px_30px_rgba(0,0,0,0.08)] p-5 z-40 hidden transform transition-transform duration-300">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center gap-6">
            <div class="h-12 w-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-xl">
                <i class="fas fa-plane"></i>
            </div>
            <div>
                <p class="text-[10px] font-black uppercase text-blue-600 tracking-tighter">Your Selection</p>
                <h3 id="selected-flight-text" class="text-lg font-extrabold text-[#003366]">---</h3>
            </div>
        </div>

        <div class="flex items-center gap-10">
            <div class="text-right">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Price</p>
                <p class="text-2xl font-black text-[#003366]">LKR <span id="total-price-display">0</span></p>
            </div>
            <button class="bg-[#005eb8] hover:bg-[#003366] text-white px-12 py-4 rounded-lg font-extrabold text-sm uppercase tracking-widest shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center gap-3">
                Confirm & Continue <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>

<!-- Your Existing Script -->
<script src="../JavaScript/FlightBooking.js"></script>

<!-- Logic for dynamic updates (Keep your FlightBooking.js logic but this is for preview) -->
<script>
    // Note: This script is just to ensure the UI looks correct in preview.
    // Your original FlightBooking.js will handle the actual data.
</script>
</body>
</html>
