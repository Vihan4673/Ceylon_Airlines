<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ceylon Airlines</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #e5edf5; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; overflow: hidden; }
        .main-card { width: 95%; max-width: 1100px; height: 650px; background: #f8fafc; border-radius: 40px; display: flex; overflow: hidden; box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.2); position: relative; }
        .left-illustration { flex: 1.4; position: relative; background-color: #1e3a5f; overflow: hidden; }
        .illustration-bg { width: 100%; height: 100%; object-fit: cover; object-position: left center; }
        .curve-overlay { position: absolute; right: -2px; top: 0; height: 100%; width: 150px; background: #f8fafc; clip-path: ellipse(100% 100% at 100% 50%); }
        .right-form { flex: 1; padding: 40px 60px; display: flex; flex-direction: column; justify-content: center; z-index: 10; }
        .input-box { background: #ffffff; border: 1.5px solid #d1dbe5; border-radius: 12px; padding: 12px 16px; transition: all 0.3s; width: 100%; }
        .input-box:focus { border-color: #8b1d41; outline: none; box-shadow: 0 0 0 4px rgba(139, 29, 65, 0.1); }
        .login-btn { background-color: #b8c9e0; color: #4a5568; font-weight: 600; padding: 14px; border-radius: 12px; width: 100%; margin-top: 20px; transition: all 0.3s; cursor: pointer; border:none; }
        .login-btn:hover { background-color: #8b1d41; color: white; }

        /* Notification Styling */
        #notification { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 12px; color: white; z-index: 2000; display: none; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .hidden { display: none; }
    </style>
</head>

<body>

<div id="notification"></div>

<div class="main-card">
    <div class="left-illustration">
        <img src="https://images.unsplash.com/photo-1502680390469-be75c86b636f?q=80&w=2070&auto=format&fit=crop" alt="Illustration" class="illustration-bg">
        <div class="absolute top-10 left-10 flex items-center gap-3 text-white z-20 bg-black/20 p-3 rounded-2xl backdrop-blur-md">
            <i class="fas fa-plane-departure text-2xl text-yellow-400"></i>
            <span class="font-bold tracking-[0.2em] text-xl uppercase">Ceylon Airlines</span>
        </div>
        <div class="curve-overlay"></div>
    </div>

    <div class="right-form">
        <div class="text-center mb-6">
            <h1 id="formTitle" class="text-4xl font-bold text-gray-800 tracking-tight">LOGIN</h1>
            <p id="formSub" class="text-gray-400 text-sm mt-2">Welcome back to Ceylon Airlines</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-gray-500 mb-2 block uppercase">Email / Username</label>
                <input id="identifier" type="text" required placeholder="Enter your email" class="input-box">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 mb-2 block uppercase">Password</label>
                <input id="password" type="password" required placeholder="Enter password" class="input-box">
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <form id="signupForm" class="space-y-4 hidden">
            <div>
                <label class="text-xs font-bold text-gray-500 mb-1 block uppercase">Username</label>
                <input id="signupUsername" type="text" required class="input-box" placeholder="Choose a username">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 mb-1 block uppercase">Email Address</label>
                <input id="signupEmail" type="email" required class="input-box" placeholder="Your email">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 mb-1 block uppercase">Password</label>
                <input id="signupPassword" type="password" required class="input-box" placeholder="Create a password">
            </div>
            <button type="submit" class="login-btn !bg-[#8b1d41] !text-white">Create Account</button>
        </form>

        <div class="mt-6 text-center">
            <p id="toggleText" class="text-sm text-gray-500">
                Don't have an account?
                <button onclick="switchTab('signup')" class="text-blue-500 font-semibold hover:underline outline-none">Sign Up</button>
            </p>
        </div>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-200"></span></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-[#f8fafc] px-2 text-gray-400">Or continue with</span></div>
        </div>

        <button onclick="loginWithGoogle()" class="flex items-center justify-center gap-3 w-full border border-gray-300 rounded-xl p-3 hover:bg-gray-50 transition-all font-semibold text-gray-600">
            <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5" alt="Google">
            Sign in with Google
        </button>
    </div>
</div>

<script src="../JavaScript/LoginPage.js"></script>


<script>
    // Tab switching logic (Global scope එකේ තැබීම වැදගත්)
    function switchTab(type) {
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");
        const title = document.getElementById("formTitle");
        const sub = document.getElementById("formSub");
        const toggleText = document.getElementById("toggleText");

        if (type === "signup") {
            loginForm.classList.add("hidden");
            signupForm.classList.remove("hidden");
            title.innerText = "SIGN UP";
            sub.innerText = "Join the Ceylon Airlines family";
            toggleText.innerHTML = 'Already have an account? <button onclick="switchTab(\'login\')" class="text-blue-500 font-semibold hover:underline outline-none">Login</button>';
        } else {
            loginForm.classList.remove("hidden");
            signupForm.classList.add("hidden");
            title.innerText = "LOGIN";
            sub.innerText = "Welcome back to Ceylon Airlines";
            toggleText.innerHTML = 'Don\'t have an account? <button onclick="switchTab(\'signup\')" class="text-blue-500 font-semibold hover:underline outline-none">Sign Up</button>';
        }
    }

    // ✅ Signup Form එක Submit කිරීමේ Logic එක මෙතනටත් එකතු කළ හැකියි
    document.getElementById("signupForm")?.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("signupUsername").value;
        const email = document.getElementById("signupEmail").value;
        const password = document.getElementById("signupPassword").value;

        try {
            const response = await fetch("http://localhost:8080/api/v1/auth/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email, password, role: "USER" })
            });

            const result = await response.json();
            if (response.ok) {
                alert("Registration Successful! Please Login.");
                switchTab('login');
            } else {
                alert(result.message || "Signup Failed");
            }
        } catch (error) {
            alert("Server connection error");
        }
    });
</script>

</body>
</html>
