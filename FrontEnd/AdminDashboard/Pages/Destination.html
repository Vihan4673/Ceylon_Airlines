<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Ceylon Airlines Destinations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    :root {
      --maroon: #8b1d41;
      --maroon-dark: #6a1632;
      --gold: #facc15;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8fafc;
    }

    .primary-gradient {
      background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    }

    .luxury-shadow {
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
    }

    input:focus {
      border-color: var(--maroon) !important;
    }

    /* Table scrollbar styling */
    .overflow-x-auto::-webkit-scrollbar {
      height: 6px;
    }
    .overflow-x-auto::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
  </style>
</head>
<body class="flex min-h-screen">

<main class="flex-grow flex flex-col w-full">

  <header class="h-20 bg-white border-b flex items-center justify-between px-8 luxury-shadow sticky top-0 z-10">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 primary-gradient rounded-xl flex items-center justify-center text-white shadow-lg">
        <i class="fas fa-map-marker-alt"></i>
      </div>
      <h2 class="text-xl font-bold text-gray-800 tracking-tight">Manage Destinations</h2>
    </div>

    <div class="flex items-center space-x-6">
      <div class="relative hidden md:block">
        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input type="text"
               id="searchInput"
               placeholder="Search by city or code..."
               class="pl-11 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm outline-none w-72 transition-all focus:bg-white focus:ring-4 focus:ring-maroon/5">
      </div>


    </div>
  </header>

  <div class="p-6 lg:p-10">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

      <div class="lg:col-span-1">
        <div class="bg-white rounded-[2.5rem] p-8 luxury-shadow border border-gray-100 sticky top-28">
          <div class="mb-8">
            <h3 class="text-lg font-bold text-gray-900">Destination Details</h3>
            <p class="text-xs text-gray-400 mt-1 font-medium">Add or update airline terminal nodes</p>
          </div>

          <form id="destinationForm" class="space-y-7">
            <div>
              <label class="text-[10px] font-black uppercase text-gray-400 mb-2 block tracking-widest">City Name</label>
              <div class="relative">
                <i class="fas fa-city absolute left-0 bottom-3 text-gray-300"></i>
                <input type="text" id="city" placeholder="e.g. London" required
                       class="w-full border-b-2 border-gray-100 pl-8 py-2 outline-none transition-all focus:border-maroon font-semibold text-gray-800 bg-transparent">
              </div>
            </div>

            <div>
              <label class="text-[10px] font-black uppercase text-gray-400 mb-2 block tracking-widest">Airport Code</label>
              <div class="relative">
                <i class="fas fa-plane-arrival absolute left-0 bottom-3 text-gray-300"></i>
                <input type="text" id="airportCode" placeholder="e.g. LHR" maxlength="3" required
                       class="w-full border-b-2 border-gray-100 pl-8 py-2 outline-none transition-all focus:border-maroon font-semibold text-gray-800 uppercase bg-transparent">
              </div>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full primary-gradient text-white py-4 rounded-2xl font-bold shadow-xl shadow-maroon-900/20 uppercase tracking-widest text-[11px] mt-4 active:scale-95 transition-all flex items-center justify-center gap-2">
              <i class="fas fa-plus-circle"></i>
              <span>Save Destination</span>
            </button>
          </form>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div class="bg-white rounded-[2.5rem] overflow-hidden luxury-shadow border border-gray-100">
          <div class="p-8 border-b border-gray-50 flex justify-between items-center bg-gray-50/30">
            <div>
              <h3 class="text-lg font-bold text-gray-900">Registered Locations</h3>
              <p class="text-xs text-gray-400 mt-1 font-medium">Manage your global flight network</p>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[10px] font-black text-maroon bg-maroon/10 px-4 py-1.5 rounded-full uppercase tracking-widest" id="count">
                    0 Locations
                </span>
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
              <tr class="text-[10px] font-black uppercase text-gray-400 tracking-widest border-b border-gray-50 bg-white">
                <th class="px-10 py-6">City</th>
                <th class="px-10 py-6 text-center">Airport Code</th>
                <th class="px-10 py-6 text-right">Actions</th>
              </tr>
              </thead>
              <tbody id="destinationTableBody" class="text-sm font-medium text-gray-700 divide-y divide-gray-50">
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</main>

<script src="../js/Destination.js"></script>

</body>
</html>
