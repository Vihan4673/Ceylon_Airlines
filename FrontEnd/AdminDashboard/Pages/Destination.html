<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Ceylone Airlines Destinations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    :root {
      --maroon: #8b1d41;
      --maroon-dark: #6a1632;
      --gold: #facc15;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8fafc;
    }

    .sidebar {
      background-color: #1a1a1a;
      transition: all 0.3s;
    }

    .primary-gradient {
      background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .nav-item {
      transition: all 0.2s;
      border-left: 4px solid transparent;
    }

    .nav-item.active {
      background: rgba(139, 29, 65, 0.1);
      color: var(--maroon);
      border-left: 4px solid var(--maroon);
    }

    .luxury-shadow {
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
    }

    input:focus {
      border-color: var(--maroon) !important;
      box-shadow: 0 0 0 2px rgba(139, 29, 65, 0.1);
    }
  </style>
</head>
<body class="flex min-h-screen">



<!-- Main Content -->
<main class="flex-grow flex flex-col">
  <!-- Header -->
  <header class="h-20 bg-white border-b flex items-center justify-between px-8 luxury-shadow">
    <h2 class="text-xl font-bold text-gray-800">Manage Destinations</h2>
    <div class="flex items-center space-x-4">
      <div class="relative hidden md:block">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-300 text-sm"></i>
        <input type="text" placeholder="Search destinations..."
               class="pl-10 pr-4 py-2 bg-gray-50 border border-gray-100 rounded-full text-sm outline-none w-64">
      </div>
      <div class="w-10 h-10 primary-gradient rounded-full flex items-center justify-center text-white font-bold">A</div>
    </div>
  </header>

  <!-- Content Area -->
  <div class="p-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

      <!-- Form Section -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-[2rem] p-8 luxury-shadow border border-gray-100">
          <h3 class="text-lg font-bold text-gray-900 mb-6">Add New Destination</h3>

          <form id="destinationForm" class="space-y-6">
            <div>
              <label class="text-[10px] font-black uppercase text-gray-400 mb-2 block tracking-widest">City Name</label>
              <div class="relative">
                <i class="fas fa-city absolute left-0 bottom-3 text-gray-300"></i>
                <input type="text" id="city" placeholder="e.g. London"
                       class="w-full border-b-2 border-gray-100 pl-8 py-2 outline-none transition focus:border-maroon font-semibold text-gray-800">
              </div>
            </div>

            <div>
              <label class="text-[10px] font-black uppercase text-gray-400 mb-2 block tracking-widest">Airport
                Code</label>
              <div class="relative">
                <i class="fas fa-plane-arrival absolute left-0 bottom-3 text-gray-300"></i>
                <input type="text" id="airportCode" placeholder="e.g. LHR"
                       class="w-full border-b-2 border-gray-100 pl-8 py-2 outline-none transition focus:border-maroon font-semibold text-gray-800 uppercase">
              </div>
            </div>

            <button type="submit"
                    class="w-full primary-gradient text-white py-4 rounded-2xl font-bold shadow-xl shadow-maroon-900/20 uppercase tracking-widest text-xs mt-4 active:scale-95 transition-all">
              Save Destination
            </button>
          </form>
        </div>
      </div>

      <!-- Table Section -->
      <div class="lg:col-span-2">
        <div class="bg-white rounded-[2.5rem] overflow-hidden luxury-shadow border border-gray-100">
          <div class="p-8 border-b border-gray-50 flex justify-between items-center">
            <h3 class="text-lg font-bold text-gray-900">Destination List</h3>
            <span class="text-[10px] font-bold text-maroon bg-maroon/5 px-3 py-1 rounded-full uppercase tracking-tighter"
                  id="count">3 Locations</span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
              <tr class="text-[10px] font-black uppercase text-gray-400 tracking-widest border-b border-gray-50">
                <th class="px-8 py-6">City</th>
                <th class="px-8 py-6 text-center">Airport Code</th>
                <th class="px-8 py-6 text-right">Actions</th>
              </tr>
              </thead>
              <tbody id="destinationTableBody" class="text-sm font-medium text-gray-700">
              <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition">
                <td class="px-8 py-5">Colombo</td>
                <td class="px-8 py-5 text-center"><span
                        class="bg-gray-100 px-3 py-1 rounded-md font-mono text-xs">CMB</span></td>
                <td class="px-8 py-5 text-right space-x-2">
                  <button class="text-gray-400 hover:text-blue-500"><i class="fas fa-edit"></i></button>
                  <button class="text-gray-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                </td>
              </tr>
              <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition">
                <td class="px-8 py-5">London</td>
                <td class="px-8 py-5 text-center"><span
                        class="bg-gray-100 px-3 py-1 rounded-md font-mono text-xs">LHR</span></td>
                <td class="px-8 py-5 text-right space-x-2">
                  <button class="text-gray-400 hover:text-blue-500"><i class="fas fa-edit"></i></button>
                  <button class="text-gray-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                </td>
              </tr>
              <tr class="hover:bg-gray-50/50 transition">
                <td class="px-8 py-5">Paris</td>
                <td class="px-8 py-5 text-center"><span
                        class="bg-gray-100 px-3 py-1 rounded-md font-mono text-xs">CDG</span></td>
                <td class="px-8 py-5 text-right space-x-2">
                  <button class="text-gray-400 hover:text-blue-500"><i class="fas fa-edit"></i></button>
                  <button class="text-gray-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</main>

<script src="../js/Destination.js">

</script>
</body>
</html>
