<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baggage Incident - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        .table-container {
            overflow-x: auto;
        }

        /* Slide Panel Animation */
        .side-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
        }

        @media (min-width: 768px) {
            .side-panel { width: 450px; }
        }

        .side-panel.active {
            transform: translateX(0);
        }

        /* Overlay Glass Effect */
        #responseOverlay {
            transition: opacity 0.3s ease;
        }

        #responseOverlay.active {
            opacity: 1 !important;
            display: block !important;
        }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="flex flex-col gap-2 mb-8">
    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Incident Center</h1>
    <div class="flex items-center gap-2">
        <span class="bg-red-100 text-red-600 text-[10px] font-black px-3 py-1 rounded-full uppercase">Real-time Monitoring</span>
        <span class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Ceylon Airlines Admin</span>
    </div>
</div>

<div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden">
    <div class="table-container">
        <table class="w-full text-left min-w-[700px]">
            <thead>
            <tr class="bg-slate-50 border-b border-slate-100">
                <th class="px-6 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Passenger</th>
                <th class="px-6 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Flight Info</th>
                <th class="px-6 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Type</th>
                <th class="px-6 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Status</th>
                <th class="px-6 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Action</th>
            </tr>
            </thead>
            <tbody id="reportList" class="divide-y divide-slate-50">
            </tbody>
        </table>
    </div>
</div>

<div id="responseOverlay" onclick="closeResponsePanel()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[90] hidden opacity-0"></div>

<aside id="responsePanel" class="side-panel flex flex-col">
    <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-white sticky top-0">
        <div>
            <h3 class="text-xl font-black text-slate-900">Resolve Claim</h3>
            <p id="panelId" class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">---</p>
        </div>
        <button onclick="closeResponsePanel()" class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center text-slate-400 hover:bg-red-50 hover:text-red-500 transition-all">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <div class="bg-slate-50 rounded-3xl p-5 border border-slate-100">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <p class="text-[9px] font-black text-slate-400 uppercase">Passenger</p>
                    <p id="pName" class="text-xs font-bold text-slate-900">---</p>
                </div>
                <div>
                    <p class="text-[9px] font-black text-slate-400 uppercase">Passport</p>
                    <p id="pPassport" class="text-xs font-bold text-slate-900">---</p>
                </div>
            </div>
            <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Issue Description</p>
            <p id="pIssue" class="text-xs text-slate-600 leading-relaxed mb-4">---</p>

            <p class="text-[9px] font-black text-slate-400 uppercase mb-2">Evidence Attachment</p>
            <div id="pPhotos" class="flex gap-2 overflow-x-auto">
            </div>
        </div>

        <form id="responseForm" class="space-y-5">
            <input type="hidden" id="reportId">

            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Set Status</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="cursor-pointer">
                        <input type="radio" name="status" value="Processing" class="hidden peer" checked>
                        <div class="text-center py-3 rounded-xl border border-slate-200 text-[10px] font-bold peer-checked:bg-amber-50 peer-checked:text-amber-700 peer-checked:border-amber-300 transition-all">PENDING</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="status" value="Approved" class="hidden peer">
                        <div class="text-center py-3 rounded-xl border border-slate-200 text-[10px] font-bold peer-checked:bg-emerald-50 peer-checked:text-emerald-700 peer-checked:border-emerald-300 transition-all">APPROVE</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="status" value="Rejected" class="hidden peer">
                        <div class="text-center py-3 rounded-xl border border-slate-200 text-[10px] font-bold peer-checked:bg-red-50 peer-checked:text-red-700 peer-checked:border-red-300 transition-all">REJECT</div>
                    </label>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Official Message to Passenger</label>
                <textarea id="adminComment" rows="4" required class="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-slate-900/5 outline-none font-medium text-sm" placeholder="Explain the decision..."></textarea>
            </div>

            <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black uppercase tracking-widest text-[10px] hover:bg-slate-800 transition-all shadow-lg active:scale-[0.98]">
                Send Notification & Resolve
            </button>
        </form>
    </div>
</aside>

<script src="../js/baggages%20report.js"></script>

</body>
</html>
