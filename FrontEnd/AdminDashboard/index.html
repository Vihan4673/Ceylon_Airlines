<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceylon Airlines | Pro Admin Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

    :root {
      --primary: #8A1538;
      --primary-dark: #6a102b;
      --secondary: #1e293b;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      overflow-x: hidden;
    }

    .sidebar-link.active {
      background-color: var(--primary);
      color: white !important;
      box-shadow: 0 10px 15px -3px rgba(138, 21, 56, 0.3);
    }

    .sidebar-link i {
      transition: transform 0.3s ease;
    }

    .sidebar-link:hover i {
      transform: translateX(3px);
    }

    /* Smooth iframe transition */
    iframe {
      width: 100%;
      height: calc(100vh - 180px); /* Default for mobile */
      border: none;
      transition: opacity 0.3s ease;
    }

    @media (min-width: 768px) {
      iframe {
        height: calc(100vh - 130px);
      }
    }

    /* Mobile Sidebar Overlay */
    #sidebar-overlay {
      display: none;
    }
    #sidebar-overlay.active {
      display: block;
    }
  </style>
</head>
<body class="antialiased">

<!-- Mobile Overlay -->
<div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 lg:hidden"></div>

<!-- Sidebar -->
<aside id="sidebar" class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full lg:translate-x-0 shadow-2xl lg:shadow-none">
  <div class="h-full px-4 py-8 overflow-y-auto bg-[#0f172a] text-white flex flex-col">
    <!-- Logo -->
    <div class="flex items-center justify-between mb-10 px-2">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-br from-[#8A1538] to-[#6a102b] p-2 rounded-xl text-white shadow-lg">
          <i class="fas fa-plane-departure text-xl"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight">Ceylon<span class="text-[#8A1538]">Air</span></h1>
      </div>
      <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="space-y-1 flex-1" id="main-nav">
      <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-4 mb-2">Main Menu</p>

      <a href="Pages/dashboard.html" target="contentFrame" onclick="updateUI('Overview', this)" class="sidebar-link active flex items-center p-3 rounded-xl transition-all group">
        <i class="fas fa-th-large w-6 text-center"></i>
        <span class="ml-3 font-semibold text-sm">Overview</span>
      </a>

      <a href="Pages/FlightAdd.html" target="contentFrame" onclick="updateUI('Flight Operations', this)" class="sidebar-link flex items-center p-3 rounded-xl transition-all group text-slate-400 hover:text-white">
        <i class="fas fa-route w-6 text-center"></i>
        <span class="ml-3 font-semibold text-sm">Flights</span>
      </a>

      <a href="Pages/booking.html" target="contentFrame" onclick="updateUI('Booking Registry', this)" class="sidebar-link flex items-center p-3 rounded-xl transition-all group text-slate-400 hover:text-white">
        <i class="fas fa-calendar-check w-6 text-center"></i>
        <span class="ml-3 font-semibold text-sm">Bookings</span>
      </a>

      <a href="Pages/Baggage.html" target="contentFrame" onclick="updateUI('Baggage Handling', this)" class="sidebar-link flex items-center p-3 rounded-xl transition-all group text-slate-400 hover:text-white">
        <i class="fas fa-suitcase w-6 text-center"></i>
        <span class="ml-3 font-semibold text-sm">Baggage</span>
      </a>

      <a href="Pages/passengers.html" target="contentFrame" onclick="updateUI('Passenger Oversight', this)" class="sidebar-link flex items-center p-3 rounded-xl transition-all group text-slate-400 hover:text-white">
        <i class="fas fa-user-shield w-6 text-center"></i>
        <span class="ml-3 font-semibold text-sm">Passengers</span>
      </a>

      <div class="pt-4">
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-4 mb-2">Content</p>
        <a href="Pages/ad.html" target="contentFrame" onclick="updateUI('Ad Management', this)" class="sidebar-link flex items-center p-3 rounded-xl transition-all group text-slate-400 hover:text-white">
          <i class="fas fa-ad w-6 text-center"></i>
          <span class="ml-3 font-semibold text-sm">Advertisements</span>
        </a>
        <a href="Pages/destination.html" target="contentFrame" onclick="updateUI('Destinations', this)" class="sidebar-link flex items-center p-3 rounded-xl transition-all group text-slate-400 hover:text-white">
          <i class="fas fa-map-marker-alt w-6 text-center"></i>
          <span class="ml-3 font-semibold text-sm">Destinations</span>
        </a>
      </div>
    </nav>

    <!-- Footer Menu -->
    <div class="mt-auto pt-6 border-t border-slate-800">
      <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-4 mb-2">System</p>
      <a href="Pages/Settings.html" class="flex items-center p-3 text-slate-400 hover:text-white transition-all">
        <i class="fas fa-cog w-6 text-center"></i>
        <span class="ml-3 font-semibold text-sm">Settings</span>
      </a>
      <a href="#" class="flex items-center p-3 text-red-400 hover:text-red-300 transition-all">
        <i class="fas fa-sign-out-alt w-6 text-center"></i>
        <span class="ml-3 font-semibold text-sm">Logout</span>
      </a>
    </div>
  </div>
</aside>

<!-- Main Content Area -->
<div class="lg:ml-64 min-h-screen flex flex-col">

  <!-- Top Nav -->
  <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-3 md:px-8 md:py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
          <i class="fas fa-bars text-xl"></i>
        </button>
        <div>
          <h2 id="view-title" class="text-lg md:text-2xl font-black text-slate-800 leading-tight">System Dashboard</h2>
          <div class="hidden sm:flex items-center gap-2 text-[10px] md:text-xs text-slate-500">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Operational Mode: Real-time
          </div>
        </div>
      </div>

      <!-- User Profile -->
      <div class="flex items-center gap-3">
        <div class="hidden md:flex flex-col text-right">
          <span class="text-xs font-bold text-slate-800">Admin User</span>
          <span class="text-[10px] text-slate-400 uppercase tracking-tighter">System Overseer</span>
        </div>
        <div class="relative group cursor-pointer">
          <img src="https://ui-avatars.com/api/?name=Admin&background=8A1538&color=fff" class="w-10 h-10 rounded-2xl border-2 border-white shadow-md">
          <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Iframe Wrapper -->
  <main class="flex-1 p-4 md:p-6 lg:p-8">
    <div class="bg-white rounded-[2rem] shadow-sm overflow-hidden border border-slate-200 h-full relative">
      <!-- Loading Indicator -->
      <div id="frame-loader" class="absolute inset-0 bg-white z-10 flex items-center justify-center transition-opacity duration-300 pointer-events-none opacity-0">
        <div class="flex flex-col items-center gap-4">
          <div class="w-10 h-10 border-4 border-[#8A1538]/20 border-t-[#8A1538] rounded-full animate-spin"></div>
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Loading View...</span>
        </div>
      </div>

      <iframe name="contentFrame" src="Pages/dashboard.html" id="main-frame" onload="hideLoader()"></iframe>
    </div>
  </main>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 z-[100] transform translate-y-32 opacity-0 transition-all duration-500">
  <div class="bg-slate-900 text-white px-6 py-4 rounded-[1.5rem] shadow-2xl flex items-center gap-4 border border-white/10">
    <div class="w-8 h-8 bg-[#8A1538] rounded-full flex items-center justify-center">
      <i class="fas fa-info text-[10px]"></i>
    </div>
    <div>
      <p class="text-xs font-bold" id="toast-title">Success</p>
      <p class="text-[10px] text-slate-400" id="toast-msg">Operation completed.</p>
    </div>
  </div>
</div>

<script>
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const frame = document.getElementById('main-frame');
  const loader = document.getElementById('frame-loader');

  function toggleSidebar() {
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('active');
  }

  function showLoader() {
    loader.classList.remove('opacity-0');
  }

  function hideLoader() {
    loader.classList.add('opacity-0');
  }

  function updateUI(title, element) {
    // Show loader when changing views
    showLoader();

    // Update Title
    document.getElementById('view-title').innerText = title;

    // Manage Sidebar active states
    const links = document.querySelectorAll('.sidebar-link');
    links.forEach(link => {
      link.classList.remove('active', 'text-white');
      link.classList.add('text-slate-400');
    });

    element.classList.add('active');
    element.classList.remove('text-slate-400');

    // Auto-close sidebar on mobile after clicking
    if (window.innerWidth < 1024) {
      toggleSidebar();
    }
  }

  function showToast(title, msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-title').innerText = title;
    document.getElementById('toast-msg').innerText = msg;

    toast.classList.remove('translate-y-32', 'opacity-0');
    setTimeout(() => {
      toast.classList.add('translate-y-32', 'opacity-0');
    }, 3000);
  }

  // Handle errors or iframe reloads
  frame.onerror = () => hideLoader();
</script>
</body>
</html>
